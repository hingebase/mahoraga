site_name: Mahoraga
site_url: https://hingebase.github.io/mahoraga/
repo_url: https://github.com/hingebase/mahoraga
repo_name: hingebase/mahoraga
edit_uri: blob/main/docs/

nav:
  - Introduction: index.md
  - tutorial.md
  - Advanced:
      - advanced/shards.md
      - advanced/panel.md
      - advanced/pyapp.md
  - changelog.md

theme:
  name: material
  favicon: assets/images/favicon.svg
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.top
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - macros:
      module_name: scripts/_mkdocs_macros
      on_error_fail: true
      on_undefined: strict
  - minify:
      cache_safe: true
      css_files:
        - assets/stylesheets/extra.css
      htmlmin_opts:
        reduce_boolean_attributes: true
        remove_comments: true
      minify_css: true
      minify_inline_css: true
      minify_inline_js: true
      minify_js: true
  - offline
  - privacy:
      assets: !ENV [MAHORAGA_DEV, true]
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hingebase/mahoraga
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mahoraga/
